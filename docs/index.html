<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Joe's Daily IT RSS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; max-width: 980px; }
      .muted { opacity: 0.75; }
      li { margin: 10px 0; }
      a { text-decoration: none; }
      a:hover { text-decoration: underline; }
      .chip { display: inline-block; padding: 2px 8px; border: 1px solid #ddd; border-radius: 999px; font-size: 12px; margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1>Joe's Daily IT RSS</h1>
    <p class="muted">
      RSS feed: <a href="./rss.xml">rss.xml</a>
      <span class="chip" id="status">Loading…</span>
    </p>

    <h2>Latest items</h2>
    <ol id="list"></ol>

    <script>
      async function loadRSS() {
        const status = document.getElementById("status");
        const list = document.getElementById("list");

        try {
          // Bust cache so you see updates quickly
          const resp = await fetch("./rss.xml?ts=" + Date.now());
          if (!resp.ok) throw new Error("HTTP " + resp.status);

          const text = await resp.text();
          const xml = new window.DOMParser().parseFromString(text, "text/xml");

          const items = Array.from(xml.querySelectorAll("item"));
          list.innerHTML = "";

          if (!items.length) {
            status.textContent = "No items found";
            list.innerHTML = "<li>No items in rss.xml yet.</li>";
            return;
          }

          // Show up to 40 most recent
          items.slice(0, 40).forEach((item) => {
            const title = item.querySelector("title")?.textContent?.trim() || "(No title)";
            const link = item.querySelector("link")?.textContent?.trim() || "#";
            const pubDate = item.querySelector("pubDate")?.textContent?.trim() || "";

            const li = document.createElement("li");
            li.innerHTML = `
              <a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>
              <div class="muted" style="font-size:12px; margin-top:4px;">${pubDate}</div>
            `;
            list.appendChild(li);
          });

          status.textContent = "Loaded " + items.length;
        } catch (e) {
          status.textContent = "Error";
          list.innerHTML = "<li>Could not load rss.xml. " + e.message + "</li>";
        }
      }

      loadRSS();
    </script>
  </body>
</html>
