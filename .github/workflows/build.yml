name: Build RSS

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour
  workflow_dispatch:

concurrency:
  group: build-rss
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate RSS
        run: |
          python scripts/build_rss.py

      - name: Commit and push XML files
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"

          git add docs/*.xml
          git commit -m "Update feeds" || echo "No changes"

          git push origin main
