name: Build RSS

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: build-rss
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (latest main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build + commit + push (no rebase)
        run: |
          set -e

          # Always start from the latest remote main
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # Build outputs
          python scripts/build_rss.py
          python scripts/build_weekly.py

          # Commit outputs
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add docs/*.xml
          git commit -m "Update feeds" || echo "No changes"

          # Push (no pull/rebase anywhere)
          git push origin main
