name: Build RSS

on:
  schedule:
    - cron: "0 * * * *"       # hourly RSS build
    - cron: "15 8 * * MON"    # weekly executive summary (Mondays 08:15 UTC)
  workflow_dispatch:

concurrency:
  group: build-rss
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (latest main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build RSS feeds
        id: build_rss
        run: |
          set -e
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python scripts/build_rss.py 2>&1 | tee /tmp/build_rss.log

          # Capture health summary for next steps
          FAILED=$(grep -c "fetch_failed" /tmp/build_rss.log || true)
          echo "failed_feeds=$FAILED" >> $GITHUB_OUTPUT

      - name: Build weekly summary
        run: python scripts/build_weekly.py

      - name: Commit and push outputs
        run: |
          git config user.name "rss-bot"
          git config user.email "rss-bot@users.noreply.github.com"
          git add docs/*.xml docs/weekly.md docs/feed_health.json
          git commit -m "Update feeds $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push origin main

      # ── Optional: annotate the Actions summary with health info ──────
      - name: Write job summary
        if: always()
        run: |
          echo "## RSS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/build_rss.log ]; then
            echo "### Feed Health" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "\[HEALTH\]|\[BUILD\]|\[WARN\]|\[SKIP\]" /tmp/build_rss.log >> $GITHUB_STEP_SUMMARY || echo "(no log lines matched)"
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # ── Optional: Slack alert when feeds fail ─────────────────────────
      # Uncomment and add SLACK_WEBHOOK_URL to repo secrets to enable.
      #
      # - name: Slack alert on feed failures
      #   if: steps.build_rss.outputs.failed_feeds != '0'
      #   run: |
      #     curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
      #       -H 'Content-type: application/json' \
      #       --data "{\"text\":\"⚠️ it-daily-rss: ${{ steps.build_rss.outputs.failed_feeds }} feed(s) failed to fetch. Check https://github.com/${{ github.repository }}/actions\"}"
